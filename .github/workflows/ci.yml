name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER: wrangler@4

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  worker:
    name: Container image and Worker bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Builds the Dockerfile and bundles deploy/freightlytics.ts without uploading anything.
      - run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  deploy:
    name: Deploy to Cloudflare
    needs: [check, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://freightlytics.io/health' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so nothing was deployed."
            echo "Deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.secrets.outputs.ready == 'true'
        run: npx --yes "$WRANGLER" deploy
      - name: Wait for the new revision on /health
        if: steps.secrets.outputs.ready == 'true'
        timeout-minutes: 20
        run: |
          revision=$(sed -n 's/^export const REVISION = "\(.*\)";$/\1/p' deploy/revision.ts)
          expected="ok $revision"
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 30 "$HEALTH_URL" || true)
            echo "attempt $attempt: ${body:-no answer}"
            if [ "$body" = "$expected" ]; then
              echo "Live: \`$body\` at $HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL did not answer '$expected' within about 15 minutes. The deploy may still be rolling out; check $HEALTH_URL again in a few minutes before redeploying."
          exit 1
